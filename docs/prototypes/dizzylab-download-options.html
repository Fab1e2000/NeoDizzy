<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DizzyLab · 专辑下载方案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeefef;color:#202326;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #1680d7;outline-offset:3px}button{border:0}header{max-width:1250px;margin:auto;padding:42px 28px 24px}.eyebrow{font-size:11px;letter-spacing:2px;color:#6b7377;font-weight:650}h1{font-size:30px;letter-spacing:-1px;margin:12px 0}header p{color:#72797e;font-size:14px;line-height:1.7;margin:0}.toolbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:24px}.toolbar label{font-size:13px;color:#626c72}.toolbar select,.reset{padding:10px 14px;background:#fff;border:1px solid #d7dcde;border-radius:10px;color:#25343d}.toolbar .hint{font-size:12px;color:#72797e}.board{max-width:1250px;margin:auto;padding:0 28px 48px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.caption{display:flex;gap:10px;align-items:baseline;margin:12px 0}.caption b{font-size:17px}.caption span{font-size:12px;color:#72797e}.letter{font-family:ui-monospace,monospace;color:#667b83}.phone{height:800px;background:var(--bg);border:1px solid #cdd3d6;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 12px 40px #25343d0a;--bg:#f2f2f4;--surface:#fff;--text:#1a1a1a;--muted:#747a80;--line:#dddfe2;--blue:#1e7fd8;--tint:#e9f2fb;color:var(--text)}body.dark .phone{--bg:#1a1a1a;--surface:#262626;--text:#f5f5f5;--muted:#a2a6ac;--line:#3b3b3f;--blue:#64b5ff;--tint:#273747}.screen{height:calc(100% - 162px);overflow-y:auto;scrollbar-width:none}.status{height:42px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;font-size:12px;font-weight:650}.nav{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:21px}.nav small{font-size:12px;color:var(--muted)}.intro{text-align:center;padding:10px 22px 20px}.cover{width:112px;height:112px;border-radius:12px;margin:0 auto 14px;background-image:url('../images/screenshots/album.png');background-size:147% auto;background-position:center 24.5%;box-shadow:0 6px 12px #0002}.intro h2{font-size:20px;margin:0 0 6px;font-weight:700}.intro p{font-size:13px;margin:0;color:var(--muted)}.transport{margin-top:20px;display:flex;gap:10px}.transport div{height:39px;flex:1;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-size:14px;font-weight:650}.transport div:first-child{background:var(--text);color:var(--bg)}.area{padding:0 20px;position:relative}.row{display:flex;align-items:center;gap:10px;min-height:52px}.grow{flex:1;min-width:0}.title{font-size:14px;font-weight:600}.sub{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}.blue{color:var(--blue)}.btn{background:var(--blue);color:#fff;border-radius:22px;min-height:36px;padding:8px 15px;font-size:13px;font-weight:650}.ghost{background:transparent;color:var(--blue);padding:10px 2px;font-size:13px}.icon{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}.circle{width:33px;height:33px;border-radius:50%;border:2px solid var(--blue);font-size:15px;color:var(--blue)}.secondary{display:flex;align-items:center;gap:20px;border-top:1px solid var(--line);margin-top:10px;padding-top:5px}.secondary button{font-size:12px}.secondary button:last-child{color:var(--muted);margin-left:auto}.meter{height:3px;background:var(--line);border-radius:5px;margin-top:10px;overflow:hidden}.meter div{height:100%;width:42%;background:var(--blue)}.card{background:var(--surface);padding:14px 16px;border-radius:17px}.tracklist{padding:20px 20px 0}.track{display:flex;align-items:center;gap:12px;height:55px;border-bottom:1px solid var(--line);font-size:13px}.track>span:first-child{font-size:12px;color:var(--muted)}.track .grow small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.track .dots{color:var(--muted)}.footnote{font-size:12px;color:#6d767c;line-height:1.8;margin:15px 2px 0}.bottom{position:absolute;bottom:0;left:0;right:0;background:var(--bg);padding:12px 20px 23px;border-top:1px solid var(--line)}.home{position:absolute;bottom:7px;width:110px;height:4px;background:var(--text);left:50%;transform:translateX(-50%);border-radius:8px}.mini{display:flex;align-items:center;gap:10px;background:var(--surface);padding:11px 13px;border-radius:18px;font-size:12px}.mini .cover{width:27px;height:27px;margin:0;border-radius:4px;flex-shrink:0}.mini b{font-size:14px}.tabs{display:flex;justify-content:space-around;margin-top:12px;color:var(--muted);font-size:11px}.tabs span:first-child{color:var(--blue)}.formats{margin-top:12px;border-top:1px solid var(--line)}.format{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:14px 0;border-bottom:1px solid var(--line);background:transparent;color:var(--text)}.format:last-child{border:0}.format strong{font-size:15px}.format small{font-size:11px;color:var(--muted);display:block;margin-top:4px}.format .arrow{margin-left:auto;color:var(--blue)}.scrim{position:absolute;inset:0;background:#0004;display:flex;align-items:flex-end;z-index:3}.sheet{width:100%;background:var(--bg);border-radius:24px 24px 0 0;padding:8px 20px 32px;box-shadow:0 -12px 40px #0001}.handle{height:4px;width:34px;background:var(--muted);opacity:.35;border-radius:4px;margin:0 auto 13px}.sheethead{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}.sheethead strong{font-size:17px}.close{width:30px;height:30px;border-radius:50%;background:var(--surface);color:var(--muted);font-size:20px}.albumsmall{display:flex;align-items:center;gap:12px;margin-bottom:18px}.albumsmall .cover{width:45px;height:45px;margin:0;border-radius:6px}.sheet .formats{background:var(--surface);border:0;border-radius:15px;padding:0 16px}.sheet .note{font-size:11px;color:var(--muted);margin-top:12px;text-align:center}.full{width:100%;margin-top:18px;border-radius:12px;height:44px}.radio{width:20px;height:20px;border:1.5px solid var(--line);border-radius:50%;margin-left:auto}.format.selected .radio{background:var(--blue);border:5px solid var(--blue);box-shadow:inset 0 0 0 2px var(--bg)}.toast{position:absolute;top:88px;left:20px;right:20px;padding:12px 14px;border-radius:12px;background:var(--text);color:var(--bg);font-size:12px;z-index:5;box-shadow:0 5px 20px #0002}.inline-formats .format{padding:12px 0}.error{color:#c84d3d}.skeleton{height:14px;width:72%;background:var(--line);border-radius:5px;margin:9px 0}.c-support{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:6px 0}.cancel{min-width:36px;min-height:36px;background:transparent;color:var(--muted);font-size:20px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.board{grid-template-columns:1fr;padding:0 18px 30px;max-width:430px}header{padding:28px 20px 18px}.phone{height:800px}h1{font-size:25px}}@media(prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateY(20px);opacity:.7}}}
</style></head><body><header><div class="eyebrow">NEODIZZY / COMPONENT STUDY 01</div><h1>专辑下载，更轻一点。</h1><p>三种组件方向 · 保留整张专辑下载、格式选择、特典与 BOOST</p><div class="toolbar"><label>预览状态 <select id="state"><option value="ready">已购买 · 未下载</option><option value="downloading">下载中</option><option value="processing">正在解压</option><option value="done">已下载</option><option value="error">下载失败</option><option value="missing">部分文件丢失</option><option value="loading">格式加载中</option><option value="empty">暂无可用格式</option></select></label><label>外观 <select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><button class="reset" id="reset">重置</button><span class="hint">点击各方案的「下载」查看格式选择 · 所有数据均为演示</span></div></header><main class="board" id="board"></main>
<script>
const board=document.getElementById('board');let state='ready';const expanded={};let selected='FLAC';
const schemes=[['A','紧凑列表','推荐','在原位置收紧信息，下载与进度共用一行。格式选择用短面板，一次点击开始。'],['B','就地展开','操作集中','直接在专辑卡片中选择格式。路径最短，但展开时会推移下方曲目。'],['C','底部操作栏','主操作突出','下载固定在底部，格式选好再确认。更易触达，但会占用底部空间。']];
function button(text,action,cls='btn'){return `<button class="${cls}" data-action="${action}">${text}</button>`}
function title(){return state==='done'?'已下载':state==='error'?'下载失败':state==='missing'?'部分文件不可用':state==='processing'?'正在解压':state==='downloading'?'正在下载':'已购买'}
function controls(id){let active=['downloading','processing'].includes(state);return `<div class="row"><span class="icon ${active?'circle':'blue'}">${state==='done'?'✓':state==='error'||state==='missing'?'!':active?(state==='processing'?'⋯':'↓'):'↓'}</span><div class="grow"><div class="title ${state==='error'?'error':''}">${title()}</div>${state==='downloading'?'<div class="sub">FLAC · 42%</div>':state==='processing'?'<div class="sub">即将加入资料库</div>':state==='done'?'<div class="sub">FLAC · 已保存到本地</div>':state==='error'?'<div class="sub">网络连接中断</div>':state==='missing'?'<div class="sub">请检查本地音乐文件</div>':''}</div>${active?button('×','cancel','cancel'):button(state==='done'?'其他格式':state==='error'?'重试':state==='missing'?'重新扫描':'下载',state==='error'?'start':state==='missing'?'scan':'open',state==='done'?'ghost':'btn')}</div>${state==='downloading'?'<div class="meter" aria-label="下载进度 42%"><div></div></div>':''}`}
function support(){return `<div class="secondary">${button('♧ 下载特典','gift','ghost')}${button('♡ BOOST','boost','ghost')}</div>`}
function formats(mode){return `<div class="formats ${mode==='inline'?'inline-formats':''}">${['FLAC','MP3','WAV'].map(f=>`<button class="format ${selected===f?'selected':''}" data-action="${mode==='confirm'?'choose':'start'}" data-format="${f}"><div class="grow"><strong>${f}</strong><small>${f==='FLAC'?'无损音频':f==='MP3'?'压缩音频':'未压缩音频'}</small></div>${mode==='confirm'?'<span class="radio"></span>':'<span class="arrow">↓</span>'}</button>`).join('')}</div>`}
function render(){board.innerHTML=schemes.map(([id,name,tag,desc])=>`<section><div class="caption"><b><span class="letter">${id}</span>　${name}</b><span>${tag}</span></div><div class="phone" data-id="${id}"><div class="status"><span>9:41</span><span>▮▮▮　▰</span></div><div class="screen"><div class="nav"><span>‹</span><small>DizzyLab</small><span>···</span></div><div class="intro"><div class="cover" role="img" aria-label="深海のフレイム专辑封面"></div><h2>深海のフレイム</h2><p>ヰ世界情緒 · 1 首歌曲</p><div class="transport"><div>▶ 播放</div><div>⤨ 随机播放</div></div></div><div class="area">${id==='C'?`<div class="c-support">${button('♧ 下载特典','gift','ghost')}${button('♡ BOOST','boost','ghost')}</div>`:`<div class="${id==='B'?'card':''}">${controls(id)}${id==='B'&&expanded[id]?formats('inline'):''}${support()}</div>`}</div><div class="tracklist"><div class="track"><span>1</span><div class="grow">深海のフレイム<small>ヰ世界情緒</small></div><span class="dots">···</span></div><div class="sub" style="margin-top:18px">2025 · 数字单曲</div></div></div><div class="bottom">${id==='C'?controls(id):`<div class="mini"><div class="cover"></div><div class="grow">深海のフレイム</div><b>Ⅱ　 ▷</b></div><div class="tabs"><span>DizzyLab</span><span>网易云音乐</span><span>资料库</span><span>搜索</span></div>`}<div class="home"></div></div></div><p class="footnote">${desc}</p></section>`).join('');if(state==='loading'||state==='empty')['A','B','C'].forEach(id=>openSheet(id));}
function openSheet(id,gift=false){const phone=board.querySelector(`[data-id="${id}"]`);phone.querySelector('.scrim')?.remove();if(id==='B'&&!gift&&!['loading','empty'].includes(state)){expanded.B=!expanded.B;render();return}let content=state==='loading'?'<div class="skeleton"></div><div class="skeleton" style="width:50%"></div><div class="skeleton"></div>':state==='empty'?'<p class="sub">暂无可下载的格式，请确认购买权限。</p>'+button('重新加载','reload','ghost'):gift?'<div class="formats"><button class="format" data-action="giftstart"><div class="grow"><strong>特典压缩包</strong><small>下载后保存到专辑的特典文件夹</small></div><span class="arrow">↓</span></button></div>':formats(id==='C'?'confirm':'instant')+(id==='C'?button('下载 '+selected,'start','btn full'):'');phone.insertAdjacentHTML('beforeend',`<div class="scrim"><div class="sheet" role="dialog" aria-label="${gift?'下载特典':'选择下载格式'}"><div class="handle"></div><div class="sheethead"><strong>${gift?'下载特典':'选择格式'}</strong>${button('×','close','close')}</div><div class="albumsmall"><div class="cover"></div><div><div class="title">深海のフレイム</div><div class="sub">ヰ世界情緒</div></div></div>${content}<div class="note">${gift?'特典独立下载':'下载完成后加入资料库'}</div></div></div>`)}
function toast(phone,text){phone.querySelector('.toast')?.remove();phone.insertAdjacentHTML('beforeend',`<div class="toast" role="status">${text}</div>`);setTimeout(()=>phone.querySelector('.toast')?.remove(),2200)}
board.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const phone=b.closest('.phone'),id=phone.dataset.id;switch(b.dataset.action){case'open':openSheet(id);break;case'gift':openSheet(id,true);break;case'close':phone.querySelector('.scrim')?.remove();break;case'choose':selected=b.dataset.format;openSheet(id);break;case'start':state='downloading';expanded.B=false;document.getElementById('state').value=state;render();break;case'cancel':state='ready';document.getElementById('state').value=state;render();break;case'scan':toast(phone,'已重新扫描 · 演示中仍有文件缺失');break;case'reload':state='ready';document.getElementById('state').value=state;render();openSheet(id);break;case'giftstart':phone.querySelector('.scrim')?.remove();toast(phone,'特典已加入下载队列 · 演示');break;case'boost':toast(phone,'实际应用中进入 BOOST 支持流程');break}});
document.getElementById('state').onchange=e=>{state=e.target.value;expanded.B=false;render()};document.getElementById('theme').onchange=e=>document.body.classList.toggle('dark',e.target.value==='dark');document.getElementById('reset').onclick=()=>{state='ready';expanded.B=false;selected='FLAC';document.getElementById('state').value=state;render()};render();
</script></body></html>
