name: NeoDizzy
options:
  bundleIdPrefix: com.elsterlee
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  # 最低 Xcode 27：工程按 Xcode 27 生成，打开时不再提示升级工程设置。
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  # DizzyLab 是中文平台，App 界面只用简体中文，不做其他语言。
  developmentLanguage: zh-Hans

# 团队 ID 等签名设置放在不入库的 Config/Signing.local.xcconfig（模板见同目录 .example）。
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  AudioTags:
    path: Packages/AudioTags
  # HTML 解析：社团页、标签页、搜索、pack 等没有 JSON 接口的页面。
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.13.0
  # 封面加载与缓存，和 MeloX 相同。
  Nuke:
    url: https://github.com/kean/Nuke
    from: 13.2.0
  # 已购专辑 ZIP 解压，保留原始音频与附带文件。
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.20

# 与 MeloX 保持同一套并发设置：之后移植它的播放代码时不用逐个改隔离标注。
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

targets:
  NeoDizzy:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      # syncedFolder：Xcode 直接跟踪整个 NeoDizzy 文件夹，
      # 新增的 .swift 文件自动参与编译，不需要重新生成工程。
      - path: NeoDizzy
        type: syncedFolder
    dependencies:
      - package: AudioTags
        product: AudioTagBridge
      - package: SwiftSoup
      - package: Nuke
        products: [Nuke, NukeUI]
      - package: ZIPFoundation
    info:
      path: NeoDizzy/Info.plist
      properties:
        # 只声明简体中文：无论系统语言是什么，App 和系统提供的按钮文字都显示中文。
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleDisplayName: NeoDizzy
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        CFBundleURLTypes:
          - CFBundleURLName: com.elsterlee.NeoDizzy.payment
            CFBundleURLSchemes: [neodizzy-pay]
            CFBundleTypeRole: Viewer
        ITSAppUsesNonExemptEncryption: false
        # 后台继续播放（M1 接入播放器后生效）。
        UIBackgroundModes: [audio]
        # 整个 App 固定深色；启动画面用同样的底色，避免闪白。
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - NeoDizzyTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elsterlee.NeoDizzy
        ASSETCATALOG_COMPILER_APPICON_NAME: NeoDizzyIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

  # 原生 macOS 版：共享 NeoDizzy/ 下的 Core、Shared 与资源，界面在 NeoDizzyMac/ 中单独实现。
  NeoDizzyMac:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: NeoDizzyMac
        type: syncedFolder
      - path: NeoDizzy
        type: syncedFolder
        # iOS 专属的入口、页面与音频会话不参与 Mac 编译。
        excludes:
          - "Info.plist"
          - "App"
          - "Features"
          - "Core/UI/PageHeader.swift"
          - "Core/UI/DiscCard.swift"
          - "Core/UI/LoadStateViews.swift"
          - "Core/UI/PlaceholderCard.swift"
          - "Core/Playback/AudioSessionConfigurator.swift"
          - "Resources/Assets.xcassets/AppIcon.appiconset"
    dependencies:
      - package: AudioTags
        product: AudioTagBridge
      - package: SwiftSoup
      - package: Nuke
        products: [Nuke, NukeUI]
      - package: ZIPFoundation
    entitlements:
      path: NeoDizzyMac/NeoDizzyMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: NeoDizzyMac/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleDisplayName: NeoDizzy
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
        NSHumanReadableCopyright: "NeoDizzy 以 GNU GPLv3 发布，与 DizzyLab 无隶属关系。"
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elsterlee.NeoDizzyMac
        PRODUCT_NAME: NeoDizzy
        ASSETCATALOG_COMPILER_APPICON_NAME: NeoDizzyIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES

  NeoDizzyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: NeoDizzyTests
        type: syncedFolder
    dependencies:
      - target: NeoDizzy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.elsterlee.NeoDizzyTests
        CODE_SIGN_STYLE: Automatic
