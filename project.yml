name: NeoDizzy
options:
  bundleIdPrefix: com.elsterlee
  deploymentTarget:
    iOS: "27.0"
  # 最低 Xcode 27：工程按 Xcode 27 生成，打开时不再提示升级工程设置。
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  # 界面文字以简体中文为源语言，英文翻译在 Localizable.xcstrings。
  developmentLanguage: zh-Hans

# 团队 ID 等签名设置放在不入库的 Config/Signing.local.xcconfig（模板见同目录 .example）。
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

# 与 MeloX 保持同一套并发设置：之后移植它的播放代码时不用逐个改隔离标注。
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

targets:
  NeoDizzy:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      # syncedFolder：Xcode 直接跟踪整个 NeoDizzy 文件夹，
      # 新增的 .swift 文件自动参与编译，不需要重新生成工程。
      - path: NeoDizzy
        type: syncedFolder
    info:
      path: NeoDizzy/Info.plist
      properties:
        # 系统语言既不是中文也不是英文时，回退到英文。
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [zh-Hans, en]
        CFBundleDisplayName: NeoDizzy
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        # 后台继续播放（M1 接入播放器后生效）。
        UIBackgroundModes: [audio]
        # 整个 App 固定深色；启动画面用同样的底色，避免闪白。
        UIUserInterfaceStyle: Dark
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - NeoDizzyTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elsterlee.NeoDizzy
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

  NeoDizzyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: NeoDizzyTests
        type: syncedFolder
    dependencies:
      - target: NeoDizzy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.elsterlee.NeoDizzyTests
        CODE_SIGN_STYLE: Automatic
